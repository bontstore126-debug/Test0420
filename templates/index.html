<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSight — AI Financial Coach</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="url(#lg)"/>
          <path d="M8 14h4l2-5 3 9 2-4h1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="lg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs>
        </svg>
        <span>FinSight</span>
      </div>
      <p class="tagline">AI-Powered Financial Coach</p>
    </div>
  </header>

  <main>
    <div class="layout">

      <!-- LEFT: Cards + Form -->
      <div class="left-panel">

        <!-- Card Wallet -->
        <section class="card-section">
          <h2 class="section-title">Your Wallet</h2>
          <div class="card-grid" id="cardGrid">
            <!-- populated by JS -->
          </div>
        </section>

        <!-- Purchase Form -->
        <section class="form-section">
          <h2 class="section-title">Analyze a Purchase</h2>
          <form id="analyzeForm">
            <div class="form-row">
              <div class="form-group">
                <label for="merchant">Merchant</label>
                <input type="text" id="merchant" placeholder="e.g. Whole Foods, Delta, Netflix" required />
              </div>
              <div class="form-group amount-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="dining">Dining</option>
                  <option value="groceries">Groceries</option>
                  <option value="travel">Travel</option>
                  <option value="gas">Gas</option>
                  <option value="entertainment">Entertainment</option>
                  <option value="shopping">Shopping</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="note">Note (optional)</label>
                <input type="text" id="note" placeholder="Any context for this purchase?" />
              </div>
            </div>
            <button type="submit" id="analyzeBtn">
              <span id="btnText">Analyze with AI</span>
              <span id="btnSpinner" class="spinner hidden"></span>
            </button>
          </form>
        </section>

      </div>

      <!-- RIGHT: Results + History -->
      <div class="right-panel">

        <!-- AI Results -->
        <section class="results-section" id="resultsSection">
          <div class="results-placeholder" id="resultsPlaceholder">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="23" stroke="#e2e8f0" stroke-width="2"/>
              <path d="M14 24h6l3-7 4 13 3-6h4" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p>Enter a purchase above to get your AI-powered card recommendation and spending insight.</p>
          </div>

          <div id="resultsContent" class="hidden">
            <!-- Card Recommendation -->
            <div class="result-block card-rec">
              <div class="result-header">
                <span class="result-icon">💳</span>
                <h3>Card Recommendation</h3>
              </div>
              <div class="rec-card" id="recCard">
                <div class="rec-card-name" id="recCardName"></div>
                <div class="rec-card-reward" id="recCardReward"></div>
                <div class="rec-card-estimate" id="recCardEstimate"></div>
              </div>
              <p class="rec-reasoning" id="recReasoning"></p>
              <div class="runner-up" id="runnerUp">
                <span class="runner-label">Runner-up:</span>
                <span id="runnerUpText"></span>
              </div>
            </div>

            <!-- Spending Nudge -->
            <div class="result-block nudge">
              <div class="result-header">
                <span class="result-icon">🧠</span>
                <h3>Spending Nudge</h3>
              </div>
              <div class="nudge-score-row">
                <div class="nudge-score-circle" id="nudgeCircle">
                  <span id="nudgeScore"></span>
                  <small>/10</small>
                </div>
                <div class="verdict-badge" id="verdictBadge"></div>
              </div>
              <div class="nudge-score-bar">
                <div class="nudge-bar-fill" id="nudgeBarFill"></div>
              </div>
              <div class="nudge-details">
                <p class="nudge-reflection" id="nudgeReflection"></p>
                <div class="nudge-insight" id="nudgePatternWrap">
                  <span class="insight-label">Pattern</span>
                  <p id="nudgePattern"></p>
                </div>
                <div class="nudge-tip" id="nudgeTipWrap">
                  <span class="insight-label">💡 Tip</span>
                  <p id="nudgeTip"></p>
                </div>
                <div class="nudge-question" id="nudgeQuestion"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Transaction History -->
        <section class="history-section">
          <h2 class="section-title">Recent Transactions</h2>
          <div id="transactionList">
            <!-- populated by JS -->
          </div>
        </section>

      </div>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
